const bytes=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
document.getElementById('lock').addEventListener('click',()=>location.reload());
document.getElementById('unlock').addEventListener('submit',async event=>{
 event.preventDefault();
 const button=document.getElementById('submit'),input=document.getElementById('password'),status=document.getElementById('status');
 button.disabled=true;status.textContent='Открываем…';
 try{
  if(!window.crypto?.subtle)throw new Error('unsupported');
  const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(input.value),'PBKDF2',false,['deriveKey']);
  input.value='';
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:bytes(ENCRYPTED.salt),iterations:ENCRYPTED.iterations,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);
  const plaintext=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(ENCRYPTED.iv)},key,bytes(ENCRYPTED.data));
  document.getElementById('dashboard').srcdoc=new TextDecoder().decode(plaintext);
  document.getElementById('login').hidden=true;document.getElementById('viewer').hidden=false;status.textContent='';
 }catch(error){status.textContent=error.message==='unsupported'?'Откройте страницу по HTTPS в современном браузере.':'Не удалось открыть: проверьте пароль.';input.focus();}
 finally{button.disabled=false;}
});
